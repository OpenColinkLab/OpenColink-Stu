server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 123.207.179.245;
    root /var/www/naiwa/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/naiwa-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naiwa-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NAIWA_SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/naiwa-miniprogram-assets.conf;

    location / { try_files $uri $uri/ =404; }
    location = /favicon.ico { access_log off; return 204; }
    location ~ /\. { deny all; }
}
