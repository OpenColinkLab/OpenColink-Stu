# Include this inside each relevant Nginx server {} block.
location ^~ /miniprogram-assets/museum/ {
    alias /var/www/naiwa-miniprogram/current/museum/;
    autoindex off;
    access_log off;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
